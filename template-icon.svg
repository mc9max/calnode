<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Calnode: scheduling / calendar — house style (indigo->cyan gradient, full-bleed tile) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- full-bleed tile -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- calendar frame (rounded, inset) -->
  <rect x="42" y="52" width="172" height="150" rx="18"
        fill="#0f172a" opacity="0.55" stroke="#7dd3fc" stroke-width="6"/>
  <!-- top header bar -->
  <rect x="42" y="52" width="172" height="34" rx="18" fill="url(#bar)"/>
  <rect x="42" y="70" width="172" height="16" fill="url(#bar)"/>
  <!-- two posts on top of the header (calendar pins) -->
  <rect x="74" y="36" width="14" height="34" rx="7" fill="#e2e8f0"/>
  <rect x="168" y="36" width="14" height="34" rx="7" fill="#e2e8f0"/>
  <!-- calendar day grid (4x3) -->
  <g fill="#c7d2fe" opacity="0.5">
    <!-- row 1 -->
    <rect x="58"  y="104" width="30" height="24" rx="5"/>
    <rect x="96"  y="104" width="30" height="24" rx="5"/>
    <rect x="130" y="104" width="30" height="24" rx="5"/>
    <rect x="164" y="104" width="30" height="24" rx="5"/>
    <!-- row 2 -->
    <rect x="58"  y="136" width="30" height="24" rx="5"/>
    <rect x="96"  y="136" width="30" height="24" rx="5"/>
    <rect x="130" y="136" width="30" height="24" rx="5"/>
    <rect x="164" y="136" width="30" height="24" rx="5"/>
    <!-- row 3 -->
    <rect x="58"  y="168" width="30" height="24" rx="5"/>
    <rect x="96"  y="168" width="30" height="24" rx="5"/>
    <rect x="130" y="168" width="30" height="24" rx="5"/>
    <rect x="164" y="168" width="30" height="24" rx="5"/>
  </g>
  <!-- highlighted "booked" day (cyan) — middle cell of row 2 -->
  <rect x="130" y="136" width="30" height="24" rx="5" fill="#22d3ee"/>
  <!-- tiny white check inside the booked cell -->
  <path d="M 138 149 L 142 154 L 152 144"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
